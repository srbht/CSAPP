# Local development services. Start with: docker compose up -d
services:
  mysql:
    image: mysql:8.4
    environment:
      MYSQL_ROOT_PASSWORD: rootpass
      MYSQL_DATABASE: cps_erp
      MYSQL_USER: cps
      MYSQL_PASSWORD: cpspass
    command: ["--character-set-server=utf8mb4", "--collation-server=utf8mb4_0900_ai_ci"]
    ports: ["3306:3306"]
    volumes: [mysql-data:/var/lib/mysql]
  redis:
    image: redis:7.4-alpine
    ports: ["6379:6379"]
volumes:
  mysql-data:
